# ============================================================================
# CPU-Only Mode - Docker Compose Override
# ============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.cpu-only.yml up
#
# This configuration disables GPU support for:
# - Development on machines without GPUs
# - Testing CPU fallback behavior
# - Cloud environments without GPU instances
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # PREFECT AGENT (CPU-Only)
  # ==========================================================================
  prefect-agent:
    # Override: Use CPU-only base image
    build:
      context: .
      dockerfile: docker/Dockerfile.worker.cpu
      args:
        - BASE_IMAGE=python:3.11-slim
    # Remove GPU runtime
    runtime: ""
    environment:
      # Force CPU mode
      - FORCE_CPU_ONLY=1
      - CUDA_VISIBLE_DEVICES=""
      - GPU_DEPLOYMENT_MODE=cpu-only
      # Keep other config
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bpo_intel}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - TZ=${TZ:-UTC}
    # Remove GPU deployment config
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ==========================================================================
  # API SERVICE (CPU-Only)
  # ==========================================================================
  api:
    # Override: Use CPU-only base image
    build:
      context: .
      dockerfile: docker/Dockerfile.api.cpu
      args:
        - BASE_IMAGE=python:3.11-slim
    # Remove GPU runtime
    runtime: ""
    environment:
      # Force CPU mode
      - FORCE_CPU_ONLY=1
      - CUDA_VISIBLE_DEVICES=""
      - GPU_DEPLOYMENT_MODE=cpu-only
      # Keep other config
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bpo_intel}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - PREFECT_API_URL=http://prefect-server:4200/api
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - TZ=${TZ:-UTC}
    # Remove GPU deployment config
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================================================
  # OLLAMA (Disabled in CPU mode - too slow)
  # ==========================================================================
  ollama:
    profiles:
      - disabled
