# ============================================================================
# Vast.AI GPU Mode - SCALED Multi-Container Deployment
# ============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.vastai-gpu-scaled.yml up
#
# This configuration runs multiple processing containers sharing the RTX 6000 Pro:
# - 2x Prefect workers (parallel processing)
# - 1x API container (embeddings endpoint)
# - 1x MCP container (Model Context Protocol server)
#
# GPU Sharing Strategy:
# - All containers access same GPU (CUDA handles concurrency)
# - NVIDIA MPS enabled for efficient sharing
# - Memory limits per container to prevent OOM
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # PREFECT WORKER 1 (Primary)
  # ==========================================================================
  prefect-agent:
    container_name: bpo-prefect-agent-1
    environment:
      - GPU_DEPLOYMENT_MODE=vastai-gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # RTX 6000 Pro optimized (96GB shared)
      - EMBEDDING_BATCH_SIZE=1024      # DOUBLED! 32x RTX 3060
      - GPU_MEMORY_FRACTION=0.45       # 43.2GB allocated
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
      - WORKER_NAME=worker-1
      - LOG_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
        limits:
          cpus: '4'
          memory: 16G
    volumes:
      - ./data:/data
      - ./Heuristics:/heuristics
      - ./src:/app/src
      - /tmp/nvidia-mps:/tmp/nvidia-mps    # MPS shared directory

  # ==========================================================================
  # PREFECT WORKER 2 (Secondary)
  # ==========================================================================
  prefect-agent-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: bpo-worker:latest
    container_name: bpo-prefect-agent-2
    runtime: nvidia
    environment:
      - GPU_DEPLOYMENT_MODE=vastai-gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Same GPU, different memory slice
      - EMBEDDING_BATCH_SIZE=1024      # DOUBLED!
      - GPU_MEMORY_FRACTION=0.45       # 43.2GB allocated
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
      - WORKER_NAME=worker-2
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bpo_intel}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - HEURISTICS_DIR=${HEURISTICS_DIR:-/heuristics}
      - DATA_DIR=${DATA_DIR:-/data}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - LOG_LEVEL=INFO
    secrets:
      - postgres_password
    volumes:
      - ./data:/data
      - ./Heuristics:/heuristics
      - ./src:/app/src
      - /tmp/nvidia-mps:/tmp/nvidia-mps
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    command: prefect worker start --pool default-pool --type docker --name worker-2
    restart: unless-stopped
    profiles:
      - base
      - scaled
    networks:
      - bpo-main-network
      - bpo-gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
        limits:
          cpus: '4'
          memory: 16G

  # ==========================================================================
  # API SERVICE (GPU-accelerated embeddings endpoint)
  # ==========================================================================
  api:
    container_name: bpo-api
    environment:
      - GPU_DEPLOYMENT_MODE=vastai-gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # API uses remaining GPU memory
      - EMBEDDING_BATCH_SIZE=512       # Conservative for API
      - GPU_MEMORY_FRACTION=0.10       # 9.6GB allocated
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
      - LOG_LEVEL=INFO
    volumes:
      - /tmp/nvidia-mps:/tmp/nvidia-mps
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
        limits:
          cpus: '2'
          memory: 8G

  # ==========================================================================
  # MCP SERVER (Model Context Protocol)
  # ==========================================================================
  mcp-server:
    image: bpo-mcp:latest
    container_name: bpo-mcp
    runtime: nvidia
    environment:
      - GPU_DEPLOYMENT_MODE=vastai-gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8100
      - LOG_LEVEL=INFO
    ports:
      - "8100:8100"
    volumes:
      - ./data:/data
      - ./src:/app/src
      - /tmp/nvidia-mps:/tmp/nvidia-mps
    networks:
      - bpo-main-network
      - bpo-gpu-network
    restart: unless-stopped
    profiles:
      - mcp
      - scaled
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
        limits:
          cpus: '2'
          memory: 8G

# ============================================================================
# GPU Sharing Configuration
# ============================================================================
#
# Total GPU Memory Allocation (96GB):
# - Worker 1: 43.2GB (45%)
# - Worker 2: 43.2GB (45%)
# - API:       9.6GB (10%)
# - Total:    96.0GB (100%)
#
# CUDA MPS (Multi-Process Service):
# - Enabled via shared /tmp/nvidia-mps volume
# - Allows efficient GPU sharing between containers
# - Better than default CUDA context switching
#
# Performance with 2 workers + API:
# - Combined throughput: 1200-1400 embeddings/sec
# - 2x parallel processing capability
# - Load balancing via Prefect
#
# To enable MPS on host (run once):
#   sudo nvidia-cuda-mps-control -d
#
# To check GPU usage across containers:
#   nvidia-smi -l 1
#   watch -n 1 'docker exec bpo-prefect-agent-1 nvidia-smi'
#   watch -n 1 'docker exec bpo-prefect-agent-2 nvidia-smi'
#
# ============================================================================
